<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🍌 Банан-Кликер</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, #33214d 0%, #180d2b 45%, #08050f 100%);
    background-attachment: fixed;
    color: #f2eefb;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  .game {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-bottom: 24px;
  }

  /* ---------- верхняя панель ---------- */
  .topbar { display: flex; justify-content: flex-end; gap: 8px; }

  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.07);
    color: #f2eefb;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background .15s, transform .1s;
  }
  .icon-btn:hover { background: rgba(255,255,255,.15); }
  .icon-btn:active { transform: scale(.92); }

  /* ---------- деньги ---------- */
  .money-box { text-align: center; }

  .money {
    font-size: clamp(34px, 11vw, 48px);
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
    background: linear-gradient(180deg, #fff6bd 0%, #ffd23f 55%, #f0a000 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 26px rgba(255, 200, 60, .3));
  }
  .cur { font-size: .6em; }

  .rate { font-size: 14px; color: #a99cc4; margin-top: 4px; }
  .rate b { color: #8ef2a5; font-weight: 700; }

  /* ---------- банан ---------- */
  .banana-wrap {
    display: grid;
    place-items: center;
    padding: 6px 0 0;
    animation: sway 3.4s ease-in-out infinite;
  }

  @keyframes sway {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-12px) rotate(4deg); }
  }

  .banana {
    font-size: clamp(110px, 34vw, 165px);
    line-height: 1;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    filter: drop-shadow(0 12px 30px rgba(255, 200, 50, .35));
    transition: transform .09s cubic-bezier(.3, 1.6, .5, 1), filter .2s;
    will-change: transform;
  }
  .banana:hover { filter: drop-shadow(0 12px 40px rgba(255, 215, 60, .55)); }

  .hint {
    text-align: center;
    font-size: 13px;
    color: #7d6f9a;
    margin-top: -6px;
  }

  /* ---------- магазин ---------- */
  .shop { display: flex; flex-direction: column; gap: 10px; }

  .upgrade {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,.1);
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.025));
    color: inherit;
    font: inherit;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
    transition: transform .08s, border-color .15s, background .15s, opacity .2s;
  }
  .upgrade:hover:not(.cant) {
    border-color: rgba(255,214,64,.55);
    background: linear-gradient(180deg, rgba(255,214,64,.15), rgba(255,255,255,.03));
  }
  .upgrade:active:not(.cant) { transform: scale(.98); }
  .upgrade.cant { opacity: .42; cursor: not-allowed; }

  .u-icon { font-size: 26px; line-height: 1; }

  .u-info { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }

  .u-title {
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .u-title em {
    font-style: normal;
    font-size: 11px;
    font-weight: 700;
    color: #ffd76a;
    background: rgba(255,215,106,.14);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .u-sub { font-size: 12px; color: #a99cc4; }
  .u-sub b { color: #d8ccf0; font-weight: 600; }
  .u-sub b:last-of-type { color: #8ef2a5; }

  .u-price {
    font-weight: 800;
    font-size: 14px;
    color: #8ef2a5;
    white-space: nowrap;
  }

  /* ---------- всплывающие цифры ---------- */
  .float {
    position: fixed;
    z-index: 100;
    pointer-events: none;
    font-weight: 800;
    font-size: 22px;
    color: #ffe066;
    text-shadow: 0 2px 10px rgba(0,0,0,.7), 0 0 18px rgba(255,200,60,.6);
    animation: floatUp .9s ease-out forwards;
  }

  @keyframes floatUp {
    0%   { opacity: 1; transform: translate(-50%, -50%) scale(.8); }
    25%  { opacity: 1; transform: translate(-50%, -85%) scale(1.18); }
    100% { opacity: 0; transform: translate(-50%, -230%) scale(1); }
  }

  /* ---------- тост ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translate(-50%, 24px);
    background: rgba(30, 20, 50, .96);
    border: 1px solid rgba(255,214,64,.4);
    color: #ffe9a3;
    padding: 11px 18px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 200;
    white-space: nowrap;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 360px) {
    .u-title { font-size: 14px; }
    .u-sub { font-size: 11px; }
  }
</style>
</head>
<body>

<main class="game">
  <div class="topbar">
    <button id="soundBtn" class="icon-btn" title="Звук" aria-label="Звук">🔊</button>
    <button id="resetBtn" class="icon-btn" title="Сбросить прогресс" aria-label="Сброс">↺</button>
  </div>

  <div class="money-box">
    <div class="money"><span id="money">0</span> <span class="cur">₽</span></div>
    <div class="rate">Доход: <b id="rate">0</b> ₽/сек</div>
  </div>

  <div class="banana-wrap">
    <button id="banana" class="banana" aria-label="Кликнуть по банану">🍌</button>
  </div>

  <div class="hint">Кликай по банану — деньги растут!</div>

  <div class="shop">
    <button class="upgrade" id="upClick">
      <span class="u-icon">👆</span>
      <span class="u-info">
        <span class="u-title">Сила клика <em id="lvlClick">ур. 1</em></span>
        <span class="u-sub">Сейчас: <b id="nowClick">1</b> ₽ → <b id="nextClick">2</b> ₽</span>
      </span>
      <span class="u-price" id="costClick">15 ₽</span>
    </button>

    <button class="upgrade" id="upAuto">
      <span class="u-icon">🤖</span>
      <span class="u-info">
        <span class="u-title">Автоклик <em id="lvlAuto">ур. 0</em></span>
        <span class="u-sub">Сейчас: <b id="nowAuto">0</b>/сек → <b id="nextAuto">1</b>/сек</span>
      </span>
      <span class="u-price" id="costAuto">50 ₽</span>
    </button>
  </div>
</main>

<div id="toast" class="toast"></div>

<script>
(() => {
  'use strict';

  const SAVE_KEY = 'banana-clicker-v1';
  const $ = (id) => document.getElementById(id);

  const el = {
    money: $('money'),
    rate: $('rate'),
    banana: $('banana'),
    lvlClick: $('lvlClick'),
    nowClick: $('nowClick'),
    nextClick: $('nextClick'),
    costClick: $('costClick'),
    lvlAuto: $('lvlAuto'),
    nowAuto: $('nowAuto'),
    nextAuto: $('nextAuto'),
    costAuto: $('costAuto'),
    upClick: $('upClick'),
    upAuto: $('upAuto'),
    soundBtn: $('soundBtn'),
    resetBtn: $('resetBtn'),
    toast: $('toast')
  };

  /* ---------------- состояние ---------------- */

  const state = {
    money: 0,
    clickLevel: 0,   // +1 ₽ к клику за уровень
    autoLevel: 0,    // +1 ₽/сек за уровень
    muted: false,
    lastSave: Date.now()
  };

  const clickPower = () => 1 + state.clickLevel;
  const autoRate   = () => state.autoLevel;
  const costClick  = () => Math.ceil(15 * Math.pow(1.17, state.clickLevel));
  const costAuto   = () => Math.ceil(50 * Math.pow(1.15, state.autoLevel));

  /* ---------------- форматирование чисел ---------------- */

  const UNITS = ['', ' тыс.', ' млн', ' млрд', ' трлн', ' квдр', ' квнт', ' скст', ' спт'];

  function fmt(n) {
    if (!isFinite(n)) return '∞';
    if (n < 1000) return String(Math.floor(n * 10) / 10);
    let i = 0;
    while (n >= 1000 && i < UNITS.length - 1) { n /= 1000; i++; }
    let s = n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2);
    if (s.indexOf('.') !== -1) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s + UNITS[i];
  }

  /* ---------------- звук ---------------- */

  let audioCtx = null;

  function ensureAudio() {
    if (state.muted) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function beep(f0, f1, dur, type, vol) {
    const ctx = ensureAudio();
    if (!ctx) return;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  const playPop  = () => beep(520 + Math.random() * 200, 190, 0.11, 'triangle', 0.07);
  const playBuy  = () => beep(420, 920, 0.16, 'sine', 0.09);
  const playError = () => beep(180, 110, 0.12, 'sawtooth', 0.05);

  /* ---------------- всплывающие цифры ---------------- */

  function floatText(x, y, text) {
    const d = document.createElement('div');
    d.className = 'float';
    d.textContent = text;
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    document.body.appendChild(d);
    d.addEventListener('animationend', () => d.remove());
  }

  /* ---------------- тост ---------------- */

  let toastTimer = null;

  function showToast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('show'), 3800);
  }

  /* ---------------- отрисовка ---------------- */

  function render() {
    el.money.textContent = fmt(Math.floor(state.money));
    el.rate.textContent = fmt(autoRate());

    el.lvlClick.textContent = 'ур. ' + (state.clickLevel + 1);
    el.nowClick.textContent = fmt(clickPower());
    el.nextClick.textContent = fmt(clickPower() + 1);
    el.costClick.textContent = fmt(costClick()) + ' ₽';

    el.lvlAuto.textContent = 'ур. ' + state.autoLevel;
    el.nowAuto.textContent = fmt(autoRate());
    el.nextAuto.textContent = fmt(autoRate() + 1);
    el.costAuto.textContent = fmt(costAuto()) + ' ₽';

    el.upClick.classList.toggle('cant', state.money < costClick());
    el.upAuto.classList.toggle('cant', state.money < costAuto());

    el.soundBtn.textContent = state.muted ? '🔇' : '🔊';
  }

  /* ---------------- сохранение ---------------- */

  function save() {
    state.lastSave = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function load() {
    let raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return; }
    if (!raw) return;

    try {
      const d = JSON.parse(raw);
      state.money      = Number(d.money) || 0;
      state.clickLevel = Number(d.clickLevel) || 0;
      state.autoLevel  = Number(d.autoLevel) || 0;
      state.muted      = !!d.muted;

      const savedAt = Number(d.lastSave) || Date.now();
      const seconds = Math.min((Date.now() - savedAt) / 1000, 7200); // максимум 2 часа
      const offline = Math.floor(autoRate() * seconds);

      if (offline > 0) {
        state.money += offline;
        setTimeout(() => showToast('Пока тебя не было: +' + fmt(offline) + ' ₽'), 500);
      }
    } catch (e) { /* битое сохранение — начинаем заново */ }
  }

  /* ---------------- клик по банану ---------------- */

  let pressTimer = null;

  el.banana.addEventListener('pointerdown', (e) => {
    e.preventDefault();

    const gain = clickPower();
    state.money += gain;

    floatText(e.clientX, e.clientY - 14, '+' + fmt(gain) + ' ₽');

    el.banana.style.transform = 'scale(0.87) rotate(-7deg)';
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => { el.banana.style.transform = ''; }, 90);

    playPop();
    render();
  });

  /* ---------------- покупки ---------------- */

  el.upClick.addEventListener('click', () => {
    const c = costClick();
    if (state.money < c) { playError(); return; }
    state.money -= c;
    state.clickLevel++;
    playBuy();
    render();
    save();
  });

  el.upAuto.addEventListener('click', () => {
    const c = costAuto();
    if (state.money < c) { playError(); return; }
    state.money -= c;
    state.autoLevel++;
    playBuy();
    render();
    save();
  });

  /* ---------------- кнопки в углу ---------------- */

  el.soundBtn.addEventListener('click', () => {
    state.muted = !state.muted;
    render();
    save();
  });

  el.resetBtn.addEventListener('click', () => {
    if (!confirm('Точно сбросить весь прогресс?')) return;
    state.money = 0;
    state.clickLevel = 0;
    state.autoLevel = 0;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    render();
    save();
    showToast('Прогресс сброшен');
  });

  /* ---------------- игровой цикл ---------------- */

  setInterval(() => {
    const r = autoRate();
    if (r > 0) state.money += r / 10;
    render();
  }, 100);

  setInterval(save, 5000);
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  /* ---------------- старт ---------------- */

  load();
  render();
})();
</script>
</body>
</html>
